<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="학원별로 도전하는 블루 아카이브 학생 이름 맞히기"><title>키보토스 출석부</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">KIVOTOS <span>STUDENT ARCHIVE</span></a><span class="edition">FAN MADE · JP SERVER</span></header>
<main><section class="hero"><p class="eyebrow">선생님, 출석을 불러주세요.</p><h1>기억 속의 학생을<br><em>모두 만나볼 시간.</em></h1><p class="intro">블루 아카이브 학생 이름 맞히기.<br>학원별로 빈 출석부를 채워보세요.</p><div class="hero-mark" aria-hidden="true">✧<span>出席簿</span></div></section>
<section class="panel" aria-label="게임 설정"><div class="settings"><label>연습할 학원<select id="school"><option value="all">모든 학원</option></select></label><label class="toggle"><input id="variants" type="checkbox" checked> 이격 포함</label><button id="reset" class="quiet">다시 시작 ↻</button></div><div class="play"><form id="answer-form"><label for="answer">학생 이름을 입력해 주세요</label><div class="inputrow"><input id="answer" autocomplete="off" placeholder="예: 아로나가 아닌, 아루!" disabled><button id="submit" type="submit">출석 확인 ↗</button></div></form><div class="stats"><div><span>출석 완료</span><strong id="score">0 / 0</strong></div><div><span>경과 시간</span><strong id="timer">00:00</strong></div></div></div><div class="track"><div id="progress"></div></div><p id="feedback" role="status" aria-live="polite">학생 데이터를 불러오고 있습니다…</p></section>
<div class="section-title"><h2>학원별 출석부</h2><span>빈 카드를 누르면 정답을 공개합니다</span></div><nav id="nav" aria-label="학원 바로가기"></nav><div id="board"></div><footer><p id="data-info"></p><p>일본 서버 실장 학생 · 콜라보 포함 · 미실장 NPC 제외</p><p>비공식 팬 게임. 캐릭터 권리는 원저작권자에게 있습니다. 데이터·이미지: <a href="https://schaledb.com" target="_blank" rel="noreferrer">SchaleDB</a> · <a href="https://silverkjw.github.io/BAtype/">원작 아이디어</a></p></footer></main><script src="app.js" defer></script></body></html>
